name: "Glossary links"

# Validates cross-links in every topic article: malformed links, links to
# glossary entries that do not exist, and non-idempotent linking (the symptom
# of a substitution that matched its own output). See scripts/link_glossary.py.
# Also validates glossary tags against the vocabulary in docs/GLOSSARY_TAGS.md
# (allowed tags, EN/ES parity, per-tag counts). See scripts/check_glossary_tags.py.
on:
  pull_request:
    paths:
      - "en/**"
      - "es/**"
      - "_posts/**"
      - "_data/glossary_aliases.yml"
      - "_data/glossary_tags.yml"
      - "docs/GLOSSARY_TAGS.md"
      - "docs/GLOSSARY_INDEX.md"
      - "scripts/link_glossary.py"
      - "scripts/check_glossary_tags.py"
      - ".github/workflows/glossary-links.yml"
  push:
    branches:
      - main
    paths:
      - "en/**"
      - "es/**"
      - "_posts/**"
      - "_data/glossary_aliases.yml"
      - "_data/glossary_tags.yml"
      - "docs/GLOSSARY_TAGS.md"
      - "docs/GLOSSARY_INDEX.md"
      - "scripts/link_glossary.py"
      - "scripts/check_glossary_tags.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check glossary links
        run: python3 scripts/link_glossary.py check --all

      - name: Check glossary tags
        run: python3 scripts/check_glossary_tags.py
