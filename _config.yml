title: Senior Forge Codex
tagline: The definitive reference for the path to Android Seniority.
description: >-
  The Senior Forge Codex: The Path to Seniority. A technical reference manual for Senior Android Developer interviews.

url: "https://aghmnl.github.io"
baseurl: "/senior-forge-codex"

author: aghmnl
github_username: aghmnl

social:
  name: aghmnl
  links:
    - https://github.com/aghmnl

theme: jekyll-theme-chirpy

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: "en"
    values:
      lang: en
  - scope:
      path: "es"
    values:
      lang: es
  # Comments and TOC on topic articles only (chapter folders); index pages opt out
  - scope:
      path: "en/0*"
    values:
      comments: true
      toc: true
  - scope:
      path: "en/10-ai"
    values:
      comments: true
      toc: true
  - scope:
      path: "es/0*"
    values:
      comments: true
      toc: true
  - scope:
      path: "es/10-ai"
    values:
      comments: true
      toc: true

# Chirpy Specific Configuration
# (Add more as needed, but this is a base start)
timezone: UTC
future: true # publish posts dated later today (local preview before 12:00 UTC)
lang: en # default language
toc: true # table of contents panel on posts and articles

# Comments: giscus (GitHub Discussions). repo_id/category_id from https://giscus.app
comments:
  provider: giscus
  giscus:
    repo: aghmnl/senior-forge-codex
    repo_id: R_kgDOSTVjMQ
    category: Announcements
    category_id: DIC_kwDOSTVjMc4DFzUx
    mapping: pathname
    strict: 0
    reactions_enabled: 1
    input_position: bottom

# Markdown engine
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM # GitHub Flavored Markdown
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true # Si querés números de línea
