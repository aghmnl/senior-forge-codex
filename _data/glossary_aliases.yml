# Extra surface forms for glossary cross-linking (see scripts/link_glossary.py).
#
# The linker already derives a form from every entry's `title:`, so this file
# only holds what a title cannot capture: translations, inflections, and the
# names a concept goes by in prose.
#
# Keys are glossary slugs. Every key must match an existing entry — `check`
# does not verify this file directly, but an unknown slug would produce a link
# to a missing entry, which it does catch.
#
# Keep a form out of this file when it is ambiguous in prose. "scope" and
# "state" appear constantly in ordinary sentences; linking every occurrence
# would be noise, so those stay manual.

cast:
  es: ["casts", "casteo", "casteos"]
  en: ["casts"]

